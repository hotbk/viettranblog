<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- TECH2BLOGS icon: a terminal chevron ">" + two stacked data bars, cut as
       negative space from a solid rounded square — "querying data from the
       command line" in one glyph, so the mark reads as Database/DevOps/DBA/AI
       specific rather than a generic tech-blog numeral. Bars (not thin seam
       lines) so the shape stays legible down to a 16px browser-tab favicon.
       Same mask geometry duplicated in src/components/NavBrand.tsx (which
       fills with the accent-color CSS variable instead of the literal hex
       below — this standalone file can't reach CSS custom properties). -->
  <mask id="t2b-favicon-mask">
    <rect width="100" height="100" rx="24" fill="#fff" />
    <path d="M20,26 L47,50 L20,74" fill="none" stroke="#000" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="54" y="58" width="26" height="11" rx="3" fill="#000" />
    <rect x="54" y="73" width="26" height="11" rx="3" fill="#000" />
  </mask>
  <rect width="100" height="100" rx="24" fill="#3D4FE8" mask="url(#t2b-favicon-mask)" />
</svg>
