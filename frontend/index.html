<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Static fallback SEO tags — used only until the app's useSeo() hook (src/useSeo.ts)
      overwrites them per-page on mount. Kept deliberately conservative:
      - robots defaults to noindex so any route that forgets to call useSeo (new admin/member
        pages, in particular) never accidentally gets indexed. Public content pages (home, post
        detail, series) explicitly override this to "index, follow".
      - Crawlers that don't execute JS (some chat-app link-preview bots) will only ever see
        these generic tags, not per-post ones — fixing that needs SSR/prerendering, not done here.
    -->
    <title>TECH2BLOGS — Database, DevOps & DBA Engineering Blog</title>
    <meta name="description" content="Practical PostgreSQL, Oracle, and Kubernetes engineering notes: performance tuning, production incidents, and DBA playbooks from real systems." />
    <meta name="robots" content="noindex" />
    <meta property="og:site_name" content="TECH2BLOGS" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TECH2BLOGS — Database, DevOps & DBA Engineering Blog" />
    <meta property="og:description" content="Practical PostgreSQL, Oracle, and Kubernetes engineering notes: performance tuning, production incidents, and DBA playbooks from real systems." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="TECH2BLOGS — Database, DevOps & DBA Engineering Blog" />
    <meta name="twitter:description" content="Practical PostgreSQL, Oracle, and Kubernetes engineering notes: performance tuning, production incidents, and DBA playbooks from real systems." />
    <script>
      // Set the theme before first paint to avoid a flash of the wrong theme.
      // Kept tiny and dependency-free on purpose — this runs ahead of the app bundle.
      (function () {
        try {
          var stored = localStorage.getItem('tb-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          // Storage/matchMedia unavailable (e.g. private mode) — default styling applies.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
